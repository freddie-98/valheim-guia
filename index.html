<title>Valheim Database</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--ink:#0e0e11;--mut:#8b8b95;--card:#f2f1f5;--trk:#e6e4ea;--mint:#58dca4;--fs:"Figtree",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--ff:"Fraunces","New York",ui-serif,Georgia,serif;--cw:min(100vw,480px);--pad:20px;--surf:#fff;--act:#e8e6ee;--chv:#b9b7c1;--icg:#b3b1bb;--btnb:#0e0e11;--btnt:#fff;--sh:rgba(20,20,40,.06);--sh2:rgba(20,20,40,.09);--page:#dedce1;--tx2:#4d4d56;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--page);-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.45 var(--fs);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.w{width:var(--cw);margin:0 auto;min-height:100dvh;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) var(--pad) calc(110px + env(safe-area-inset-bottom))}
@media(min-width:520px){.w{box-shadow:0 0 0 1px rgba(0,0,0,.04),0 24px 70px rgba(40,30,60,.14)}}
#nav{display:flex;justify-content:space-between;align-items:center;height:44px;margin-bottom:12px}
#bk{width:44px;height:44px;margin-left:-10px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.pill2{height:36px;padding:0 14px;border:0;border-radius:99px;background:var(--surf);box-shadow:0 1px 8px var(--sh2);font:600 15px var(--fs)}
#ttl{font:800 36px/1.08 var(--ff);letter-spacing:-.015em;margin:6px 0 6px;overflow-wrap:anywhere}
#sub{color:var(--mut);font-size:15px;line-height:1.4;margin:0 0 18px}
.sf{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;margin-top:14px;background:var(--card);border-radius:16px;color:var(--mut)}
#q{flex:1;min-width:0;border:0;outline:0;background:none;font:400 16px var(--fs);color:var(--ink);-webkit-appearance:none}
#q::placeholder{color:var(--mut)}
.tabw{margin:16px calc(var(--pad)*-1) 0}
.tabs{position:relative;display:flex;gap:20px;overflow-x:auto;padding:0 var(--pad);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tb2{flex:none;min-height:44px;padding:0;border:0;background:none;font:500 16px var(--fs);color:var(--tx2);white-space:nowrap}
.tb2.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--mint)}
.trk{height:4px;margin:2px var(--pad) 0;background:var(--trk);border-radius:2px;position:relative;overflow:hidden}
.trk i{position:absolute;top:0;bottom:0;left:0;width:30%;background:var(--ink);border-radius:2px}
.fl2{margin:16px 0 0;font:800 11px var(--fs);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.fl2+.tabw{margin-top:0}
.sec{font:300 25px/1.2 var(--fs);letter-spacing:-.01em;margin:32px 0 14px}
.cap{margin:-6px 0 12px;color:var(--mut);font-size:14px}
.cnt{margin:18px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--mut)}
.bars{background:var(--card);border-radius:20px;overflow:hidden}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:50px;padding:0 16px;border:0;background:none;text-align:left;font:800 12px var(--fs);letter-spacing:.16em;text-transform:uppercase}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--surf);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar span,.bar b{position:relative}
.bar b{font-weight:800}
.tbl{border-radius:20px;overflow:hidden;background:var(--surf);box-shadow:0 1px 0 var(--sh),0 10px 30px var(--sh)}
.lr{display:grid;grid-template-columns:1fr auto 16px;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 14px 8px 12px;border:0;border-left:4px solid var(--c,transparent);background:var(--surf);text-align:left}
.lr:nth-child(odd){background:var(--card)}
.ln{display:flex;align-items:center;gap:10px;font:800 12px/1.45 var(--fs);letter-spacing:.12em;text-transform:uppercase;min-width:0}
.ln .ic{flex:none;color:var(--icg)}
.ln img.ic{border-radius:6px}
.lv{font:700 11px var(--fs);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;max-width:38vw}
.chv{color:var(--chv)}
.card{background:var(--card);border-radius:20px}
.card.p{padding:16px}
.card p{margin:0 0 12px}.card ol{margin:0 0 12px;padding-left:20px}.card li{margin:4px 0}
.mut{color:var(--mut);font-size:14px}
.btn{display:block;width:100%;min-height:50px;margin-top:22px;border:0;border-radius:16px;background:var(--btnb);color:var(--btnt);font:700 16px var(--fs)}
.card .btn{margin-top:4px}
.para{padding:16px;background:var(--card);border-radius:20px}
.lead{font-size:18px;line-height:1.45;margin:16px 0 0}
.bars,.tbl{margin-bottom:0}
/* detalhe */
#det{position:fixed;top:0;bottom:0;left:calc((100vw - var(--cw))/2);width:var(--cw);z-index:30;display:none;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) calc(40px + env(safe-area-inset-bottom))}
body[data-d="1"] #det{display:block;animation:push .32s cubic-bezier(.2,.8,.2,1) both}
.dnav{display:flex;justify-content:space-between;align-items:center;height:44px;margin-bottom:12px}
.dnav #dback{width:44px;height:44px;margin-left:-10px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.dic{width:60px;height:60px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);margin-bottom:14px}
.dic .ic{width:34px;height:34px}.dic img.ic{border-radius:8px}
.dt{font:800 34px/1.1 var(--ff);letter-spacing:-.015em;margin:0 0 6px;overflow-wrap:anywhere}
.dsub{color:var(--mut);font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,var(--surf));font:700 13px var(--fs);color:var(--ink)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pills:empty{display:none}
.ir{display:grid;grid-template-columns:minmax(0,1.5fr) 46px minmax(0,1fr);align-items:center;gap:8px;width:100%;min-height:58px;padding:8px 14px;border:0;background:var(--surf);text-align:left}
.ir:nth-child(odd){background:var(--card)}
.ir.lk::after{content:none}
.il{font:800 12px/1.4 var(--fs);letter-spacing:.12em;text-transform:uppercase}
.iq{font:800 15px var(--fs);letter-spacing:.04em;text-align:right}
.ib{display:block;height:8px;border-radius:4px;background:var(--trk);overflow:hidden}
.ir:nth-child(odd) .ib{background:var(--surf)}
.ib i{display:block;height:100%;border-radius:4px;background:var(--mint)}
.ir.br .ib i{background:var(--c)}
.ir.br{grid-template-columns:minmax(0,1.5fr) 0 minmax(0,1fr)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:13px 14px;background:var(--surf)}
.kv:nth-child(odd){background:var(--card)}
.kv b{font:700 14px/1.4 var(--fs);text-align:right}
.kv.st{flex-direction:column;gap:4px}.kv.st b{text-align:left;font-weight:600}
.kv.one{font-size:14px;color:var(--tx2)}
textarea{display:block;width:100%;min-height:110px;padding:14px 16px;border:0;border-radius:18px;background:var(--card);font:400 16px/1.45 var(--fs);color:var(--ink);resize:vertical;outline:0}
/* barra inferior */
#tb{position:fixed;bottom:0;left:calc((100vw - var(--cw))/2);width:var(--cw);z-index:20;display:flex;justify-content:space-around;padding:10px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surf);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px var(--sh2)}
#tb button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:84px;min-height:50px;border:0;background:none;color:var(--mut);font:600 11px var(--fs)}
#tb button.on{color:var(--ink)}
#tb button.on svg{color:var(--ink)}
#tb button.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--mint);margin-top:1px}
#tb button:not(.on)::after{content:"";height:4px}
/* movimento */
@keyframes push{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#body>*{animation:up .35s cubic-bezier(.2,.7,.2,1) both}
.lr,.bar,.ir,.tb2,.btn,.pill2{transition:background-color .15s,transform .12s}
.lr:active,.bar:active,.ir.lk:active{background:var(--act)}
.btn:active,.pill2:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* tema escuro */
:root[data-theme="dark"]{--bg:#0f1012;--ink:#f3f3f6;--mut:#9b9ba6;--card:#1a1b1f;--trk:#2c2d34;--surf:#222328;--act:#2c2d34;--chv:#5d5d68;--icg:#6d6d78;--btnb:#f3f3f6;--btnt:#0e0e11;--sh:rgba(0,0,0,.25);--sh2:rgba(0,0,0,.45);--page:#050506;--tx2:#c4c4cc;color-scheme:dark}
:root[data-theme="dark"] .trk i{background:var(--ink)}
:root[data-theme="dark"] .pill{color:var(--ink)}
:root[data-theme="dark"] #tb{box-shadow:0 -1px 0 #2c2d34,0 -8px 30px rgba(0,0,0,.5)}
.seg{display:flex;gap:6px;padding:4px;background:var(--surf);border-radius:14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:none;font:600 15px var(--fs);color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.gt{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:18px;min-height:150px;padding:18px;border:0;border-radius:26px;background:var(--card);text-align:left;overflow:hidden;transition:transform .15s,background-color .2s}
.gt::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--mint);opacity:.0;transition:opacity .2s}
.gt:active{transform:scale(.97);background:var(--act)}
.gt:active::after{opacity:1}
.gi{width:56px;height:56px;border-radius:18px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 1px 0 var(--sh),0 8px 20px var(--sh)}
.gn{font:800 21px/1.1 var(--ff);letter-spacing:-.01em;color:var(--ink)}
.gc{display:block;margin-top:5px;font:800 11px var(--fs);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.gt>span:not(.gi){display:block}
.sech{display:flex;align-items:baseline;justify-content:space-between}.lnk{border:0;background:none;color:var(--mut);font:600 15px var(--fs);padding:8px 0;min-height:44px}
.para.mut{color:var(--mut);font-size:15px}
body[data-v="home"] #nav{display:none}body[data-v="home"] .w{padding-top:calc(env(safe-area-inset-top) + 28px)}
.empty{margin-top:28px;padding:40px 24px;border-radius:24px;background:var(--card);text-align:center;color:var(--mut)}.empty svg{color:var(--icg)}.empty p{margin:12px 0 6px;font:800 20px var(--ff);color:var(--ink)}.empty span{font-size:15px;line-height:1.45}
.w{padding-top:calc(env(safe-area-inset-top) + 36px)}
body[data-v="home"] .w{padding-top:calc(env(safe-area-inset-top) + 64px)}
#det{padding-top:calc(env(safe-area-inset-top) + 36px)}
#nav,.dnav{margin-bottom:20px}
body[data-v="home"] #sub{margin-bottom:26px}
body[data-v="home"] .grid4{margin-top:30px;gap:14px}
body[data-v="home"] .gt{min-height:164px}
body[data-v="home"] .sec{margin-top:40px}
</style>

</head>

 return({Escudos:"shield",Munição:"arrow",Ferramentas:"tool",Comida:"food",Poções:"potion","Itens e acessórios":"box",Estações:"anvil",Materiais:"gem",Chefes:"skull",Biomas:"tree",Dicas:"book"})[c]||"box"}
const nk=s=>String(s||"").toLowerCase().replace(/\.[a-z0-9]+$/,"").replace(/[^a-z0-9]/g,"").replace(/icon$/,"");
let ICONS={};
const P2E={};D.forEach(x=>{if(x[5])P2E[x[1]]=nk(x[5])});
const imgOf=k=>k&&ICONS[k]?ICONS[k]:null;
const svg0=(x,s)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[ik(x)]}</svg>`;
const svg=(x,s)=>{const u=imgOf(nk(x[5]));return u?`<img class="ic" src="${u}" width="${s}" height="${s}" alt="">`:svg0(x,s)};
function inCat(x){const g=GR.find(g=>g[0]==cat);return cat=="Todos"||(cat=="★ Favoritos"?fav.includes(x[1]):g?g[2].includes(x[0]):x[0]==cat)}
function matches(){
 const toks=nrm(q).split(/\s+/).filter(Boolean);
 let ur=null;if(uses){const e=uses.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");ur=new RegExp("(^|, |: |\\) )\\d+ "+e+"(,|$)")}
 const r=[];
 D.forEach((x,i)=>{
  if(ur){if(ur.test(x[3])||ur.test(x[3].replace(/^[^:]*: /,"")))r.push(x);return}
  if(!inCat(x))return;
  for(const [k,,fn] of FG){if(F[k]&&!has(fn(x),F[k]))return}
  const h=H[i]+" "+nrm(notes[x[1]]||"");
  if(toks.every(t=>h.includes(t)))r.push(x)});
 return r}

let theme=ld("vh_theme","auto");
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(){const d=theme=="dark"||(theme=="auto"&&mq.matches);document.documentElement.dataset.theme=d?"dark":"light";const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?"#0f1012":"#fafafa"}
mq.addEventListener&&mq.addEventListener("change",applyTheme);applyTheme();
const CHV='<svg class="chv" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const BACK='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>';
$("#bk").innerHTML=BACK;
let tabSet=false,hist=[],lastDet="",recent=ld("vh_recent",[]);
function addRecent(n){recent=[n,...recent.filter(r=>r!=n)].slice(0,8);sv("vh_recent",recent)}
const find=n=>D.find(x=>x[1]==n);
function meta(x){if(x[0]=="Biomas")return x[2];const b=bio(x);if(b.length)return b[0]+(b.length>1?" +"+(b.length-1):"");return sta(x)||x[2]}
function ings(r){const m=r.match(/^(.*?: )?(\d+ .+)$/);if(!m)return null;const ps=m[2].split(", ");if(!ps.every(p=>/^\d+ \S/.test(p)))return null;return{pre:(m[1]||"").replace(/: $/,""),it:ps.map(p=>{const k=p.match(/^(\d+) (.+)$/);return[+k[1],k[2]]})}}
function tabsH(items,act,attr,trk,extra){return `<div class="tabw"><div class="tabs">${items.map(([v,l])=>`<button class="tb2${v==act?" on":""}" ${attr}="${esc(v)}"${extra||""}>${esc(l)}</button>`).join("")}</div>${trk?'<div class="trk"><i></i></div>':""}</div>`}
function wire(keep,saved){document.querySelectorAll("#body .tabw").forEach((w,i)=>{
 const t=w.querySelector(".tabs"),trk=w.querySelector(".trk"),th=trk&&trk.firstChild;
 const up=()=>{const o=t.scrollWidth-t.clientWidth;if(!trk)return;trk.style.visibility=o>4?"visible":"hidden";if(o<=4)return;const p=t.clientWidth/t.scrollWidth;th.style.width=p*100+"%";th.style.left=(t.scrollLeft/o)*(1-p)*100+"%"};
 if(keep&&saved)t.scrollLeft=saved[i]||0;else{const a=t.querySelector(".on");if(a&&a.offsetLeft>t.clientWidth*.5)t.scrollLeft=a.offsetLeft-24}
 t.addEventListener("scroll",up,{passive:true});up()})}
function icoCell(x,s){const u=imgOf(nk(x[5]));return u?`<img class="ic" src="${u}" width="${s}" height="${s}" alt="">`:svg0(x,s)}
function pillsH(x){const b=bio(x);if(b.length)return b.map(n=>`<span class="pill" style="--c:${BC[n]}">${esc(n)}</span>`).join("");const c=col(x);return c&&x[2]?`<span class="pill" style="--c:${c}">${esc(x[2])}</span>`:""}
function kvRows(rows){return rows.map(l=>{const m=l.match(/^([^:]{1,34}): (.+)$/);return m?`<div class="kv${m[2].length>30?" st":""}"><span class="il">${esc(m[1])}</span><b>${esc(m[2])}</b></div>`:`<div class="kv one">${esc(l)}</div>`}).join("")}
function detail(x){
 const isTip=x[0]=="Dicas";let h="";
 const I=ings(x[3]);
 h+=`<div class="dnav"><button id="dback" aria-label="Voltar">${BACK}</button><button class="pill2" data-s="${esc(x[1])}">${fav.includes(x[1])?"★ Favorito":"☆ Favoritar"}</button></div>`;
 h+=`<div class="dic">${icoCell(x,34)}</div><h1 class="dt">${esc(x[1])}</h1><div class="dsub">${esc(x[0])}${x[5]?" · "+esc(x[5]):""}</div><div class="pills">${pillsH(x)}</div>`;
 if(isTip)h+=`<p class="lead">${esc(x[3])}</p>`;
 else if(I){const mx=Math.max(...I.it.map(a=>a[0]));
  h+=`<h2 class="sec">Requisitos</h2>${I.pre?`<div class="cap">${esc(I.pre)}</div>`:""}<div class="tbl">`+I.it.map(([q,n])=>{const g=find(n);return `<${g?"button data-go=\""+esc(n)+"\"":"div"} class="ir${g?" lk":""}"><span class="il">${esc(n)}</span><b class="iq">${q}</b><span class="ib"><i style="width:${Math.max(8,q/mx*100)}%"></i></span></${g?"button":"div"}>`}).join("")+`</div>`}
 else if(x[0]=="Materiais"||x[0]=="Troféus"){h+=`<h2 class="sec">Onde encontrar</h2><div class="tbl">`+x[2].split(", ").map(b=>`<div class="ir br" style="--c:${BC[b]||"#999"}"><span class="il">${esc(b)}</span><span></span><span class="ib"><i style="width:100%"></i></span></div>`).join("")+`</div>`}
 else if(x[3])h+=`<h2 class="sec">${x[0]=="Estações"?"Custo":"Informações"}</h2><div class="para">${esc(x[3])}</div>`;
 if(x[4]){const gs=[{h:null,r:[]}];x[4].split(/ \| | · /).forEach(l=>{if(l[0]=="#")gs.push({h:l.slice(2),r:[]});else gs[gs.length-1].r.push(l)});
  gs.forEach(g=>{if(!g.r.length)return;const hp=(g.h||"Detalhes").split(" — ");h+=`<h2 class="sec">${esc(hp[0])}</h2>${hp[1]?`<div class="cap">${esc(hp[1])}</div>`:""}<div class="tbl kvt">${kvRows(g.r)}</div>`})}
 h+=`<button class="btn" data-u="${esc(x[1])}">Onde é usado</button><h2 class="sec">Notas</h2><textarea data-t="${esc(x[1])}" placeholder="Escreva aqui suas anotações…">${esc(notes[x[1]]||"")}</textarea>`;
 return h}
function setH(){
 return `<h2 class="sec">Aparência</h2><div class="seg">${[["auto","Automático"],["light","Claro"],["dark","Escuro"]].map(([v,l])=>`<button data-th="${v}" class="${theme==v?"on":""}">${l}</button>`).join("")}</div>
 <h2 class="sec">Ícones do jogo</h2><div class="card p"><p>Importe imagens de ícones que você já tenha. Elas ficam guardadas só neste aparelho.</p><button class="btn" data-act="imp">Importar ícones</button><div id="impst" class="mut"></div></div>
 <h2 class="sec">Sobre</h2><div class="tbl kvt"><div class="kv"><span class="il">Itens</span><b>${D.length}</b></div><div class="kv"><span class="il">Favoritos</span><b>${fav.length}</b></div></div>`}
function render(keep){
 const saved=keep?[...document.querySelectorAll("#body .tabs")].map(t=>t.scrollLeft):null;
 const isHome=!q.trim()&&cat=="Todos"&&!uses&&!browse&&!tabSet;
 const isFav=cat=="★ Favoritos"&&!tabSet&&!uses&&!q.trim();
 const view=tabSet?"set":isFav?"fav":isHome?"home":"list";
 const cur=dopen&&sel?find(sel):null;if(!cur)dopen=false;
 const B=document.body;B.dataset.v=view;B.dataset.d=dopen?"1":"0";document.documentElement.style.overflow=dopen?"hidden":"";
 $("#bk").style.visibility=view=="home"?"hidden":"visible";
 $("#ttl").textContent=view=="home"?"Valheim Database":view=="set"?"Ajustes":view=="fav"?"Favoritos":uses?"Onde é usado":cat=="Todos"?(q.trim()?"Busca":"Todos os itens"):cat.replace("★ ","");
 $("#sub").textContent=view=="home"?"Seu guia de bolso: itens, receitas e onde encontrar tudo.":"";
 $("#sub").style.display=view=="home"?"":"none";
 $("#sfw").style.display=view=="set"||view=="fav"?"none":"";
 document.querySelectorAll("#tb button").forEach(b=>b.classList.toggle("on",b.dataset.tab==(view=="set"?"set":view=="fav"?"fav":"home")));
 const cl=["Todos",...GR.map(g=>g[0])];
 let h="";
 if(view=="home"){
  h+=`<div class="grid4">`+GR.map(([n,ic,cs])=>`<button class="gt" data-c="${esc(n)}"><span class="gi"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[ic]}</svg></span><span class="gn">${esc(n)}</span></button>`).join("")+`</div>`;
  const rc=recent.map(find).filter(Boolean);
  h+=`<div class="sech"><h2 class="sec">Recentes</h2>${rc.length?'<button class="lnk" data-clr="1">Limpar</button>':""}</div>`+(rc.length?`<div class="tbl">`+rc.map(x=>`<button class="lr" style="--c:${col(x)||"transparent"}" data-n="${esc(x[1])}"><span class="ln">${icoCell(x,20)}<span>${esc(x[1])}</span></span><span class="lv">${esc(meta(x))}</span>${CHV}</button>`).join("")+`</div>`:`<div class="para mut">Os itens que você abrir aparecem aqui.</div>`)}
 else if(view=="set")h+=setH();
 else if(view=="fav"){
  const fl=[...fav].reverse().map(find).filter(Boolean);
  h+=fl.length?`<div class="cnt">${fl.length} ${fl.length==1?"item favorito":"itens favoritos"}</div><div class="tbl">`+fl.map(x=>`<button class="lr" style="--c:${col(x)||"transparent"}" data-n="${esc(x[1])}"><span class="ln">${icoCell(x,20)}<span>${esc(x[1])}</span></span><span class="lv">${esc(meta(x))}</span>${CHV}</button>`).join("")+`</div>`
   :`<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></svg><p>Nenhum favorito ainda.</p><span>Abra um item e toque em <b>☆ Favoritar</b> para guardá-lo aqui.</span></div>`}
 else{
  const r=matches();const pool=D.filter(x=>cat=="Todos"?true:inCat(x));
  if(!uses)h+=tabsH(cl.map(c=>[c,c]),cat,"data-c",1);
  if(!uses&&cat!="Todos"&&cat!="★ Favoritos")h+=FG.map(([k,l,fn])=>{const o=[...new Set(pool.flatMap(x=>{const v=fn(x);return Array.isArray(v)?v:[v]}).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt"));return o.length>1?`<div class="fl2">${l}</div>`+tabsH([["","Todas"],...o.map(f=>[f,f])],F[k]||"","data-f",0,` data-g="${k}"`):""}).join("");
  h+=`<div class="cnt">${uses?`Usado em ${r.length} receita(s)`:r.length+(r.length==1?" resultado":" resultados")}${uses?` <button id="cu" class="pill2">✕ limpar</button>`:""}</div>`;
  h+=r.length?`<div class="tbl">`+r.map(x=>`<button class="lr" style="--c:${col(x)||"transparent"}" data-n="${esc(x[1])}"><span class="ln">${icoCell(x,20)}<span>${esc(x[1])}</span></span><span class="lv">${esc(meta(x))}</span>${CHV}</button>`).join("")+`</div>`:`<div class="para">${cat=="★ Favoritos"?"Toque em ☆ Favoritar dentro de um item para guardá-lo aqui.":"Nada encontrado. Tente outra palavra ou categoria."}</div>`}
 $("#body").innerHTML=h;wire(keep,saved);
 if(view=="set")status();
 const dh=cur?detail(cur):"";if(dh!==lastDet){$("#det").innerHTML=dh;lastDet=dh}}
function reset(){browse=false;q="";cat="Todos";F={tipo:"",est:"",bio:"",hab:""};uses=null;sel=null;dopen=false;tabSet=false;hist=[];$("#q").value="";render();window.scrollTo(0,0)}
function open(n,h){if(!h)hist=[];addRecent(n);sel=n;dopen=true;lastDet="";render();$("#det").scrollTop=0}
$("#q").oninput=e=>{q=e.target.value;dopen=false;tabSet=false;uses=null;if(cat=="★ Favoritos")cat="Todos";render()};
$("#q").onkeydown=e=>{if(e.key=="Enter"){if(!q.trim()){browse=true;tabSet=false;render()}e.target.blur()}};
document.addEventListener("click",e=>{
 const th=e.target.closest("[data-th]");if(th){theme=th.dataset.th;sv("vh_theme",theme);applyTheme();render(true);return}
 const t=e.target.closest("[data-c],[data-f],[data-n],[data-go],[data-u],[data-s],[data-tab],[data-act],[data-sh],[data-clr],#dback,#bk,#cu");if(!t)return;const d=t.dataset;
 if(d.c!==undefined){cat=d.c;F={tipo:"",est:"",bio:"",hab:""};uses=null;sel=null;dopen=false;tabSet=false;if(cat=="Todos"&&!q.trim())browse=true;render();window.scrollTo(0,0)}
 else if(d.f!==undefined){F[d.g]=d.f;render(true)}
 else if(d.n!==undefined)open(d.n);
 else if(d.clr!==undefined){recent=[];sv("vh_recent",recent);render(true)}
 else if(d.go!==undefined){hist.push(sel);sel=d.go;addRecent(d.go);lastDet="";render();$("#det").scrollTop=0}
 else if(d.u!==undefined){uses=d.u;sel=null;dopen=false;hist=[];cat="Todos";tabSet=false;render();window.scrollTo(0,0)}
 else if(d.s!==undefined){const n=d.s;fav=fav.includes(n)?fav.filter(f=>f!=n):[...fav,n];sv("vh_fav",fav);render(true)}
 else if(d.tab!==undefined){if(d.tab=="home")reset();else if(d.tab=="fav"){q="";$("#q").value="";cat="★ Favoritos";F={tipo:"",est:"",bio:"",hab:""};uses=null;sel=null;dopen=false;tabSet=false;render();window.scrollTo(0,0)}else{tabSet=true;dopen=false;render();window.scrollTo(0,0)}}
 else if(d.act=="imp")$("#fi").click();
 else if(t.id=="dback"){if(hist.length)sel=hist.pop();else dopen=false;lastDet="";render()}
 else if(t.id=="bk"){if(tabSet){tabSet=false;render()}else reset()}
 else if(t.id=="cu"){uses=null;sel=null;render()}});
$("#det").oninput=e=>{const n=e.target.dataset.t;if(n){notes[n]=e.target.value;sv("vh_notes",notes)}};
render();

function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("vh_icons",1);r.onupgradeneeded=()=>r.result.createObjectStore("ic");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function status(){const e=$("#impst");if(!e)return;const n=Object.keys(ICONS).filter(k=>D.some(x=>nk(x[5])==k)).length;e.textContent=n?n+" ícones carregados neste aparelho.":"Nenhum ícone carregado ainda."}
idb().then(d=>{const s=d.transaction("ic").objectStore("ic");const ks=s.getAllKeys(),vs=s.getAll();vs.onsuccess=()=>{ks.result.forEach((k,i)=>ICONS[k]=vs.result[i]);lastDet="";render(true)}}).catch(()=>{});
function small(f){return new Promise(res=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const g=c.getContext("2d"),k=Math.min(96/im.width,96/im.height);g.drawImage(im,(96-im.width*k)/2,(96-im.height*k)/2,im.width*k,im.height*k);URL.revokeObjectURL(u);res(c.toDataURL("image/png"))};im.onerror=()=>res(null);im.src=u})}
$("#fi").onchange=async e=>{
 const fs=[...e.target.files];let ok=0,miss=[];
 const names=new Set(D.map(x=>nk(x[5])));
 for(const f of fs){const k=nk(f.name);if(!names.has(k)){miss.push(f.name);continue}const u=await small(f);if(u){ICONS[k]=u;ok++}}
 try{const d=await idb();const t=d.transaction("ic","readwrite");Object.entries(ICONS).forEach(([k,v])=>t.objectStore("ic").put(v,k))}catch(err){}
 e.target.value="";lastDet="";render(true);
 const s=$("#impst");if(s)s.textContent=ok+" de "+fs.length+" imagens combinaram com itens."+(miss.length?" Sem correspondência: "+miss.slice(0,6).join(", ")+(miss.length>6?"…":""):"")};

</script>
